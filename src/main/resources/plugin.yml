name: NexusAdmin
version: ${project.version}
main: com.nexusuniverse.admin.NexusAdminPlugin
api-version: '1.21'
author: Nexus Universe
description: Powerful admin/staff abilities (vanish, god mode, fly, freeze, smite, teleport, instant-kill) with built-in abuse resistance -- every use is logged and broadcast live to other staff, the more invasive abilities require a stated reason, and destructive ones are cooldown-limited. Also a clickable in-game admin panel (a chat button on join, or /admin any time) with a category per plugin -- Staff Powers plus Economy/Survival/Realms when those are installed -- for the same real admin controls those plugins' own commands already offer, without typing.
softdepend: [NexusEconomy, NexusSurvival, NexusRealms]

commands:
  nexusadmin:
    description: Admin abilities, and the clickable admin panel.
    aliases: [na, admin]
    usage: /nexusadmin <menu|vanish|god|fly|freeze <player> <reason>|smite <target>|tp <player>|tphere <player> <reason>|kill <target> [reason]|log [count]>

permissions:
  nexusadmin.menu:
    description: Open the clickable admin panel (/nexusadmin menu, the bare /admin command, or the join-message button).
    default: op
  nexusadmin.vanish:
    description: Turn invisible and hidden from the player list.
    default: op
  nexusadmin.god:
    description: Toggle invulnerability.
    default: op
  nexusadmin.fly:
    description: Toggle flight.
    default: op
  nexusadmin.freeze:
    description: Freeze another player in place.
    default: op
  nexusadmin.smite:
    description: Call down lightning on a target.
    default: op
  nexusadmin.teleport:
    description: Teleport to a player, or bring a player to you.
    default: op
  nexusadmin.kill:
    description: Instantly kill a target.
    default: op
  nexusadmin.log:
    description: View the recent admin-ability audit log.
    default: op
  nexusadmin.watch:
    description: See a live feed of every admin ability used on the server, as it happens.
    default: op
  nexusadmin.seevanish:
    description: See players who are vanished.
    default: op
